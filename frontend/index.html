<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>tellus — Climate Dashboard</title>
    <script>
      try {
        var cfg = JSON.parse(localStorage.getItem("tellus-config-v1") || "{}");
        if (cfg.theme) document.documentElement.dataset.theme = cfg.theme;
        if (cfg.locale) document.documentElement.lang = cfg.locale;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
